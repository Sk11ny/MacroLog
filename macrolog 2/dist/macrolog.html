<title>MacroLog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#fbfbfa;
  --panel:#ffffff;
  --panel-2:#f4f5f6;
  --ink:#101215;
  --ink-2:#575d66;
  --ink-3:#8b9099;
  --rule:#dfe1e5;
  --rule-strong:#b8bcc3;
  --protein:#2a78d6;
  --carbs:#eb6834;
  --fat:#1baf7a;
  --fiber:#4a3aa7;
  --good:#0ca30c;
  --over:#d03b3b;
  --est:#fab219;
  --est-ink:#8a5c00;
  --focus:#2a78d6;
  --shadow:0 1px 2px rgba(16,18,21,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101215;
    --panel:#191b1f;
    --panel-2:#212429;
    --ink:#f2f3f5;
    --ink-2:#b6bbc4;
    --ink-3:#868c96;
    --rule:#2b2f36;
    --rule-strong:#454b55;
    --protein:#3987e5;
    --carbs:#d95926;
    --fat:#199e70;
    --fiber:#9085e9;
    --good:#28c228;
    --over:#e2564f;
    --est:#fab219;
    --est-ink:#f0c260;
    --focus:#3987e5;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101215;
  --panel:#191b1f;
  --panel-2:#212429;
  --ink:#f2f3f5;
  --ink-2:#b6bbc4;
  --ink-3:#868c96;
  --rule:#2b2f36;
  --rule-strong:#454b55;
  --protein:#3987e5;
  --carbs:#d95926;
  --fat:#199e70;
  --fiber:#9085e9;
  --good:#28c228;
  --over:#e2564f;
  --est:#fab219;
  --est-ink:#f0c260;
  --focus:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:0 72px;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px;}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);padding-block:14px 10px;border-bottom:1px solid var(--rule);}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.wordmark{
  font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em;
  margin:0;text-transform:uppercase;
}
.seg{display:flex;gap:2px;background:var(--panel-2);border-radius:8px;padding:2px;}
.seg button{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase;
  border:none;background:none;color:var(--ink-2);padding:6px 10px;border-radius:6px;
}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);}
@media (max-width:520px){
  .topbar-row{flex-wrap:wrap;row-gap:9px;}
  .seg{width:100%;}
  .seg button{flex:1;text-align:center;padding:7px 4px;}
}
.seg-sm{padding:2px;}
.seg-sm button{font-size:11px;padding:5px 9px;}

.datebar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;}
.datebar-label{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:15px;text-align:center;min-width:150px;
  display:flex;flex-direction:column;line-height:1.15;
}
.datebar-label em{font-style:normal;font-weight:500;font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase;}
.icon-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);
  color:var(--ink);font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;
}
.icon-btn:disabled{opacity:.35;cursor:not-allowed;}
.icon-btn:hover:not(:disabled){border-color:var(--rule-strong);}

.main{padding-top:16px;display:flex;flex-direction:column;gap:16px;}
.boot{padding:40px 0;display:flex;justify-content:center;}

/* ---------- panel (the nutrition-label grammar) ---------- */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:14px 16px 16px;box-shadow:var(--shadow);}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:8px;}
.panel-title{font-family:"Archivo",sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em;}
.panel-date{font-family:"Archivo",sans-serif;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);}
.rule{height:1px;background:var(--rule);margin-block:9px;}
.rule-heavy{height:4px;background:var(--ink);margin-block:8px;}

.cal-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.cal-left{display:flex;flex-direction:column;}
.cal-label{font-family:"Archivo",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em;}
.cal-sub{font-size:12.5px;color:var(--ink-2);}
.cal-right{display:flex;align-items:baseline;gap:6px;font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;}
.cal-value{font-weight:700;font-size:34px;line-height:1;letter-spacing:-.02em;}
.cal-goal{font-weight:500;font-size:14px;color:var(--ink-3);}

.bar-track{height:6px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-top:8px;}
.bar-fill{height:100%;border-radius:4px;transition:width .25s ease;}
.pct-line{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;}

.macro-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.macro-name{font-family:"Archivo",sans-serif;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;display:inline-flex;align-items:center;gap:7px;}
.swatch{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none;}
.macro-values{display:inline-flex;align-items:baseline;gap:6px;font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;}
.macro-value{font-weight:700;font-size:17px;}
.macro-goal{font-weight:500;font-size:12.5px;color:var(--ink-3);}
.macro-pct{font-weight:600;font-size:11.5px;color:var(--ink-3);min-width:36px;text-align:right;}
.macro-pct.is-over{color:var(--over);}

/* ---------- chips ---------- */
.chip{font-family:"Archivo",sans-serif;font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap;}
.chip-neutral{color:var(--ink-2);background:var(--panel-2);}
.chip-good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent);}
.chip-over{color:var(--over);background:color-mix(in srgb,var(--over) 13%,transparent);}
.chip-est{color:var(--est-ink);background:color-mix(in srgb,var(--est) 20%,transparent);}

/* ---------- add methods ---------- */
.methods{display:flex;flex-direction:column;gap:8px;}
.method{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;color:var(--ink);
}
.method:hover:not(:disabled){border-color:var(--focus);}
.method:disabled{opacity:.42;cursor:not-allowed;}
.method-icon{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;background:var(--panel-2);color:var(--ink-2);flex:none;}
.method-text{display:flex;flex-direction:column;gap:1px;}
.method-text strong{font-family:"Archivo",sans-serif;font-weight:600;font-size:14.5px;}
.method-text em{font-style:normal;font-size:12.5px;color:var(--ink-3);}
.method-note{font-size:12.5px;color:var(--ink-3);margin:2px 2px 0;}

/* ---------- flows ---------- */
.flow{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);}
.flow-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.flow-head h2{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.04em;margin:0;}
.flow-copy{font-size:13.5px;color:var(--ink-2);margin:0;}
.preview{width:100%;max-width:100%;max-height:230px;object-fit:contain;border-radius:8px;background:var(--panel-2);}

.picker-wrap{display:flex;flex-direction:column;gap:9px;}
.picker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

/* ---------- live camera ---------- */
.cam{display:flex;flex-direction:column;gap:11px;}
.cam-stage{position:relative;width:100%;max-width:100%;aspect-ratio:3/4;max-height:56vh;background:#0b0c0e;border-radius:11px;overflow:hidden;}
.cam-video{width:100%;height:100%;object-fit:cover;display:block;}
.cam-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--panel-2);}
.cam-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.shutter{width:62px;height:62px;border-radius:50%;border:3px solid var(--ink);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;}
.shutter span{width:46px;height:46px;border-radius:50%;background:var(--ink);display:block;}
.shutter:hover:not(:disabled) span{opacity:.85;}
.shutter:disabled{opacity:.38;cursor:not-allowed;}
.cam-note{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-radius:8px;padding:9px 11px;}
.picker-btn{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:13.5px;
  background:var(--ink);color:var(--panel);border:none;border-radius:9px;padding:11px 18px;
}
.picker-btn:hover{opacity:.88;}
.picker-hint{font-size:12px;color:var(--ink-3);}

.spinner{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2);}
.spinner-dot{width:9px;height:9px;border-radius:50%;background:var(--focus);animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.28;transform:scale(.82);}50%{opacity:1;transform:scale(1);}}

.error-panel{border:1px solid color-mix(in srgb,var(--over) 40%,var(--rule));background:color-mix(in srgb,var(--over) 7%,transparent);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;}
.error-head{font-family:"Archivo",sans-serif;font-weight:600;font-size:13.5px;}
.error-detail{font-size:12.5px;color:var(--ink-2);}
.error-code{font-family:"Archivo",sans-serif;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}

.warn-note{font-size:12.5px;color:var(--ink);background:color-mix(in srgb,var(--est) 16%,transparent);border-radius:8px;padding:9px 11px;}
.soft-note{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-radius:8px;padding:9px 11px;}
.est-banner{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap;}

/* ---------- barcode scanning ---------- */
.cam-stage-wide{aspect-ratio:4/3;}
.scan-guide{position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--over);opacity:.85;
  box-shadow:0 0 0 1px rgba(0,0,0,.25);transform:translateY(-50%);pointer-events:none;}
.code-line{font-family:"Archivo",sans-serif;font-weight:600;letter-spacing:.08em;font-variant-numeric:tabular-nums;}
.known-meal{border:1px solid var(--ink);border-radius:9px;padding:11px 13px;}
.known-name{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;}
.check-row{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--ink-2);cursor:pointer;}
.check-row input{margin:2px 0 0;accent-color:var(--focus);width:15px;height:15px;flex:none;}

/* ---------- account ---------- */
.account-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:4px;}
.account-email{font-family:"Archivo",sans-serif;font-weight:600;font-size:14.5px;word-break:break-all;}

/* ---------- fields ---------- */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:7px;}
.field-label{font-family:"Archivo",sans-serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);}
.field-input{display:inline-flex;align-items:center;gap:6px;flex:0 1 190px;}
.field-input input{
  width:100%;min-width:0;text-align:right;border:1px solid var(--rule);background:var(--paper);color:var(--ink);
  border-radius:7px;padding:8px 10px;font-size:14px;font-variant-numeric:tabular-nums;
}
.field-input input:hover{border-color:var(--rule-strong);}
.field-input input[type=number]::-webkit-outer-spin-button,
.field-input input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.field-input input[type=number]{-moz-appearance:textfield;}
.field-suffix{font-family:"Archivo",sans-serif;font-size:11.5px;font-weight:600;color:var(--ink-3);min-width:34px;}

.describe-input{width:100%;max-width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);
  border-radius:9px;padding:11px 12px;font-family:inherit;font-size:14.5px;line-height:1.45;resize:vertical;min-height:92px;}
.describe-input:hover{border-color:var(--rule-strong);}
.describe-input::placeholder{color:var(--ink-3);}
.mini-panel{border:1px solid var(--rule);border-radius:9px;padding:10px 12px 6px;background:var(--paper);}
.mini-head{font-family:"Archivo",sans-serif;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);}
.basis-row,.scale-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.scale-controls{display:inline-flex;align-items:center;gap:10px;}
.scale-val{font-family:"Archivo",sans-serif;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;min-width:52px;text-align:center;}

.row-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.btn{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:13.5px;
  border:1px solid var(--rule-strong);background:var(--panel);color:var(--ink);border-radius:9px;padding:10px 15px;
}
.btn:hover:not(:disabled){border-color:var(--ink-2);}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--panel);}
.btn-primary:hover:not(:disabled){opacity:.88;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-sq{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:17px;}
.saved-note{font-size:12.5px;color:var(--good);font-weight:600;}

.scaled{border:1px solid var(--ink);border-radius:9px;padding:11px 13px;}
.scaled-head{font-family:"Archivo",sans-serif;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:8px;}
.scaled-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.scaled-cell{display:flex;flex-direction:column;gap:1px;min-width:0;}
.scaled-v{font-family:"Archivo",sans-serif;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.1;}
.scaled-cal .scaled-v{font-size:20px;}
.scaled-k{font-size:10.5px;color:var(--ink-3);letter-spacing:.02em;}
@media (max-width:430px){.scaled-grid{grid-template-columns:repeat(3,1fr);}}

/* ---------- saved meals ---------- */
.strip{display:flex;flex-direction:column;gap:8px;}
.strip-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-inline:2px;}
.section-head-inline{font-family:"Archivo",sans-serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);}
.link-btn{background:none;border:none;padding:0;color:var(--ink-2);font-family:"Archivo",sans-serif;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;text-decoration:underline;text-underline-offset:3px;}
.link-btn:hover{color:var(--ink);}
.strip-chips{display:flex;flex-wrap:wrap;gap:8px;}
.meal-chip{display:flex;flex-direction:column;gap:1px;text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:9px;padding:8px 11px;color:var(--ink);box-shadow:var(--shadow);}
.meal-chip:hover{border-color:var(--focus);}
.meal-chip-name{font-family:"Archivo",sans-serif;font-weight:600;font-size:13.5px;}
.meal-chip-macros{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
.strip-empty{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);border:1px dashed var(--rule-strong);border-radius:10px;padding:11px 13px;}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn-danger{background:var(--over);border-color:var(--over);color:#fff;}
.meal-list{list-style:none;margin:0;padding:0;}
.meal-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 2px;border-bottom:1px solid var(--rule);}
.meal-main{flex:1 1 190px;min-width:0;}
.meal-name{font-family:"Archivo",sans-serif;font-weight:600;font-size:14.5px;}
.meal-macros{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:1px;}
.meal-actions{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;}
.meal-form{display:flex;flex-direction:column;gap:2px;}
.toast{font-size:12.5px;font-weight:600;color:var(--good);background:color-mix(in srgb,var(--good) 11%,transparent);border-radius:8px;padding:8px 11px;}
.bookmark-btn{background:none;border:none;padding:4px;color:var(--ink-3);display:inline-flex;align-items:center;border-radius:6px;}
.bookmark-btn:hover{color:var(--focus);}

/* ---------- entries ---------- */
.section-head{font-family:"Archivo",sans-serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:4px 2px -6px;}
.empty{font-size:13.5px;color:var(--ink-3);padding:14px 2px;}
.entry-list,.day-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
.entry{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--rule);}
.entry-main{flex:1;min-width:0;}
.entry-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.entry-meta{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:1px;}
.entry-cal{display:flex;flex-direction:column;align-items:flex-end;font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;}
.entry-cal span:first-child{font-weight:700;font-size:16px;}
.entry-unit{font-size:10px;color:var(--ink-3);letter-spacing:.04em;}

/* ---------- charts ---------- */
.chart{margin:0;padding-block:4px 2px;}
.chart-title{font-family:"Archivo",sans-serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px;}
.chart-goal-key{font-weight:500;font-size:10.5px;letter-spacing:.04em;color:var(--ink-3);}
.chart-plot{position:relative;}
.chart-plot svg{display:block;max-width:100%;}
.chart-tick{font-family:"Archivo",sans-serif;font-size:10px;font-weight:600;letter-spacing:.04em;}
.tip{
  position:absolute;top:0;transform:translateX(-50%);pointer-events:none;
  background:var(--ink);color:var(--paper);border-radius:7px;padding:6px 9px;
  display:flex;flex-direction:column;gap:1px;font-size:11.5px;white-space:nowrap;z-index:5;
}
.tip strong{font-family:"Archivo",sans-serif;font-size:11.5px;font-weight:700;}
.tip-over,.tip-under{opacity:.72;font-variant-numeric:tabular-nums;}

.avg-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.avg{background:var(--panel);border:1px solid var(--rule);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:1px;}
.avg-v{font-family:"Archivo",sans-serif;font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1;}
.avg-k{font-size:10.5px;color:var(--ink-3);letter-spacing:.02em;}

.day-row{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--rule);padding:11px 2px;color:var(--ink);
}
.day-row:hover{background:var(--panel-2);}
.day-name{flex:1;min-width:0;display:flex;flex-direction:column;font-family:"Archivo",sans-serif;font-weight:600;font-size:14px;}
.day-name em{font-style:normal;font-family:"Figtree",sans-serif;font-weight:400;font-size:11.5px;color:var(--ink-3);}
.day-nums{display:inline-flex;align-items:baseline;gap:12px;font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;}
.day-cal,.day-pro{font-weight:700;font-size:15px;display:inline-flex;align-items:baseline;gap:3px;}
.day-nums em{font-style:normal;font-weight:500;font-size:10px;color:var(--ink-3);}

.fine{font-size:12.5px;color:var(--ink-3);margin:0 2px;}
